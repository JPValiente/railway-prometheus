global:
  scrape_interval: 15s
  external_labels:
    monitor: 'railway-prom'

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'falco-core'
    metrics_path: /q/metrics
    static_configs:
      - targets: ['falco-core.railway.internal:9000']
        labels:
          application: 'falco-core'
